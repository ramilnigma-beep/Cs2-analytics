<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark"><meta name="theme-color" content="#0a0e16"><title>CS2 Analytics</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style id="app-style">:root{--bg:#0a0e16;--panel:#111826;--panel2:#162033;--line:#233149;--text:#e7eef9;--muted:#8fa0ba;--accent:#ff8a1f;--cyan:#27d3f0;--green:#3ddc97;--red:#ff6b6b;--yellow:#ffc857;--violet:#a78bfa;--radius:10px;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{min-height:100vh;overflow-x:clip;-webkit-tap-highlight-color:transparent}
.grid>*,main>*{min-width:0}
.plgrid{grid-template-columns:minmax(200px,260px) minmax(0,1fr);align-items:start}
.plside{max-height:78vh;overflow:auto}
.mhead{background:var(--panel)}
a{color:var(--cyan);text-decoration:none;cursor:pointer}a:hover{text-decoration:underline}
h1,h2,h3,h4{margin:0 0 .5em;font-weight:650;letter-spacing:.2px}
h2{font-size:18px}h3{font-size:15px}h4{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px}
.topbar{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#0d1422,#0a0e16);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;padding:10px 16px 4px}
.brand b{font-size:17px}.brand b span{color:var(--accent)}
.brand small{color:var(--muted)}
.brand .grow{flex:1}
nav{display:flex;gap:4px;padding:4px 12px 8px;overflow-x:auto;scrollbar-width:thin}
nav button{flex:none;background:transparent;border:1px solid transparent;color:var(--muted);padding:7px 12px;border-radius:8px;cursor:pointer;font:inherit;white-space:nowrap}
nav button:hover{color:var(--text);background:var(--panel)}
nav button.on{color:#fff;background:var(--panel2);border-color:var(--line);box-shadow:inset 0 -2px 0 var(--accent)}
nav .sep{width:1px;background:var(--line);margin:4px 6px;flex:none}
nav .badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:6px;border-radius:9px;font-size:11px;text-align:center;background:var(--red);color:#111}
main{max-width:1280px;margin:0 auto;padding:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:14px}
.card.flat{background:transparent}
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr))}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px}
.kpi .v{font-size:24px;font-weight:700}.kpi .l{color:var(--muted);font-size:12px}.kpi .s{color:var(--muted);font-size:11px;margin-top:2px}
.cols2{grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr))}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.sp{justify-content:space-between}
.grow{flex:1}
.muted{color:var(--muted)}.small{font-size:12px}.tiny{font-size:11px}
.good{color:var(--green)}.bad{color:var(--red)}.warn{color:var(--yellow)}.acc{color:var(--accent)}.cy{color:var(--cyan)}
input,select,textarea,button.btn{font:inherit;color:var(--text);background:#0c1220;border:1px solid var(--line);border-radius:8px;padding:7px 10px}
input:focus,select:focus,textarea:focus{outline:2px solid #27d3f055;border-color:var(--cyan)}
input[type=checkbox],input[type=radio]{accent-color:var(--accent);width:16px;height:16px;padding:0}
input[type=number]{width:84px}
textarea{width:100%;min-height:140px;font:12px/1.4 ui-monospace,Consolas,monospace}
button.btn{cursor:pointer;background:var(--panel2)}
button.btn:hover{border-color:var(--cyan)}
button.btn.pri{background:var(--accent);color:#1a0d00;border-color:var(--accent);font-weight:650}
button.btn.pri:hover{filter:brightness(1.08)}
button.btn.danger{border-color:#6b2b2b;color:var(--red)}
button.btn[disabled]{opacity:.45;cursor:not-allowed}
button.btn.sm{padding:3px 8px;font-size:12px}
body.viewer .ro{display:none!important}
button.btn.on{background:var(--accent);color:#1a0d00;border-color:var(--accent);font-weight:650}
.seg{display:inline-flex;gap:4px}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:7px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
td.l,th.l{text-align:left}
thead th{position:sticky;top:0;background:#0f1726;color:var(--muted);font-weight:600;font-size:12px;cursor:default;user-select:none}
thead th.srt{cursor:pointer}thead th.srt:hover{color:var(--text)}
thead th.cur{color:var(--accent)}
tbody tr:hover{background:#141d2e}
tbody tr.dim td{opacity:.62}
tbody tr.click{cursor:pointer}
.tag{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11px;border:1px solid var(--line);color:var(--muted);background:#0c1220}
.tag.crit{color:#ffb4b4;border-color:#7a2d2d;background:#2a1212}
.tag.warn{color:#ffe0a1;border-color:#7a5b1d;background:#2a2010}
.tag.info{color:#a7e7f5;border-color:#1d5b6b;background:#0f2128}
.tag.ok{color:#a9f0cf;border-color:#1f6a4a;background:#0e231b}
.tag.mut{color:var(--muted)}
.pill{display:inline-block;padding:0 6px;border-radius:5px;font-weight:700;font-size:11px;margin-right:2px}
.pill.W{background:#123b2a;color:var(--green)}.pill.L{background:#401a1a;color:var(--red)}.pill.D{background:#33301a;color:var(--yellow)}.pill.N{background:#1a2234;color:var(--muted)}
.note{border-left:3px solid var(--cyan);background:#0e1a26;padding:8px 12px;border-radius:0 8px 8px 0;margin:8px 0;color:#c9d6ea}
.note.warn{border-color:var(--yellow);background:#221c0e}
.note.crit{border-color:var(--red);background:#2a1212}
.note b{color:#fff}
.bar{height:8px;background:#0c1220;border-radius:5px;overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--accent))}
.meter{position:relative;height:16px;border-radius:8px;background:linear-gradient(90deg,#ff6b6b,#ffc857 25%,#3ddc97 45%,#3ddc97 55%,#ffc857 75%,#ff6b6b);border:1px solid var(--line)}
.meter i{position:absolute;top:-4px;width:4px;height:22px;background:#fff;border-radius:2px;box-shadow:0 0 0 2px #0a0e16;transition:left .25s}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.tabs button{background:#0c1220;border:1px solid var(--line);color:var(--muted);padding:5px 12px;border-radius:16px;cursor:pointer;font:inherit}
.tabs button.on{background:var(--panel2);color:#fff;border-color:var(--accent)}
.hm td.c{text-align:center;cursor:pointer;min-width:62px;padding:5px 6px;border-left:1px solid #0a0e16}
.hm td.c small{display:block;color:#ffffffa0;font-size:10px}
.hm td.c.e{cursor:default;color:#41506b}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:#0c1220;cursor:pointer;margin:3px}
.chip:hover{border-color:var(--cyan)}
.chip.sel{border-color:var(--accent);box-shadow:0 0 0 2px #ff8a1f44}
.chip.pin{background:#10243a}
.team{border:1px solid var(--line);border-radius:var(--radius);padding:12px;background:var(--panel)}
.team.A{border-top:3px solid var(--cyan)}.team.B{border-top:3px solid var(--accent)}
.overlay{position:fixed;inset:0;background:#000000b0;z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:4vh 10px;overflow:auto}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:12px;max-width:980px;width:100%;padding:16px}
.toasts{position:fixed;right:12px;bottom:12px;z-index:60;display:flex;flex-direction:column;gap:6px;max-width:min(420px,92vw)}
.toast{background:#1b2740;border:1px solid var(--line);border-left:4px solid var(--cyan);padding:9px 12px;border-radius:8px;box-shadow:0 6px 24px #0008}
.toast.err{border-left-color:var(--red)}.toast.ok{border-left-color:var(--green)}
.banner{background:#241a08;border-bottom:1px solid #7a5b1d;padding:8px 16px;color:#ffe0a1}
.spark{display:block;max-width:100%;height:auto}
code,.mono{font-family:ui-monospace,Consolas,monospace;font-size:12px;background:#0c1220;padding:1px 5px;border-radius:4px}
pre.mono{padding:10px;overflow:auto;white-space:pre-wrap}
details{margin:6px 0}summary{cursor:pointer;color:var(--cyan)}
hr{border:0;border-top:1px solid var(--line);margin:12px 0}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
ul.clean{margin:4px 0;padding-left:18px}
th,td{padding-left:6px;padding-right:6px}.tag{white-space:nowrap}

.ro{opacity:.45;pointer-events:none}

/* ===== Телефон и узкие экраны ===== */
@media(max-width:820px){
  .plgrid{grid-template-columns:minmax(0,1fr)}
  .plside{max-height:none;overflow:visible;position:static;padding:0;background:transparent;border:0}
  .plchips{position:sticky;top:var(--tb,96px);z-index:5;background:var(--bg);padding:6px 0}
  .plside input{margin-bottom:6px}
  .plchips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .plchips::-webkit-scrollbar{display:none}
  .plchips .chip{flex:none;margin:0;padding:7px 11px;white-space:nowrap}
}
@media(max-width:700px){
  html,body{font-size:15px}
  main{padding:10px 10px calc(16px + env(safe-area-inset-bottom));padding-left:max(10px,env(safe-area-inset-left));padding-right:max(10px,env(safe-area-inset-right))}
  .card{padding:12px;margin-bottom:12px;border-radius:12px}
  h2{font-size:17px}
  /* шапка: компактная, одна строка бренда + прокручиваемые вкладки */
  .brand{padding:8px 12px 2px;gap:2px 10px;flex-wrap:wrap;padding-left:max(12px,env(safe-area-inset-left))}
  .brand b{font-size:16px;white-space:nowrap}
  .brand small{font-size:11.5px;line-height:1.25}
  .brand .offl{display:none}
  nav{padding:2px 8px 8px;gap:2px;scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity;
      -webkit-mask-image:linear-gradient(90deg,#000 90%,transparent);mask-image:linear-gradient(90deg,#000 90%,transparent)}
  nav::-webkit-scrollbar{display:none}
  nav button{padding:9px 13px;scroll-snap-align:center;font-size:14px}
  /* сетки — в колонку, карточки показателей — по две в ряд */
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .kpi{padding:10px}.kpi .v{font-size:21px}
  .cols2{grid-template-columns:minmax(0,1fr)}
  /* таблицы: прокрутка внутри блока, первая колонка закреплена, компактнее */
  .scroll{-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;border-radius:10px;margin-left:-2px;margin-right:-2px}
  table{font-size:13px}
  .card>table,.modal>table{display:block;overflow-x:auto;max-width:100%;-webkit-overflow-scrolling:touch}   /* страховка для таблиц без обёртки .scroll */
  th,td{padding:8px 7px}
  .scroll table th:first-child,.scroll table td:first-child{position:sticky;left:0;z-index:2;background:var(--panel);box-shadow:1px 0 0 var(--line)}
  .scroll table thead th:first-child{background:#0f1726;z-index:3}
  tbody tr:hover{background:transparent}
  tbody tr.dim td{opacity:1;color:#6f7d94}tbody tr.dim td a{opacity:.7}
  /* контроль качества: строка = мини-карточка */
  .qtable thead{display:none}
  .qtable,.qtable tbody{display:block;width:100%}
  .qtable tr{display:flex;flex-wrap:wrap;align-items:center;gap:2px 10px;padding:9px 10px;border-bottom:1px solid var(--line)}
  .qtable td,.qtable td:first-child{display:block;position:static;border:0;padding:0;background:transparent;box-shadow:none;white-space:normal}
  .qtable td.qd{flex:1 0 100%;min-width:0!important;font-size:13.5px;line-height:1.4;margin-top:2px}
  /* элементы ввода: 16px — чтобы iOS/Android не увеличивали страницу при фокусе; крупные зоны нажатия */
  input,select,textarea{font-size:16px;min-height:42px}
  input[type=checkbox],input[type=radio]{min-height:0;width:20px;height:20px}
  button.btn{min-height:42px;padding:8px 13px}
  button.btn.sm{min-height:36px;padding:6px 11px;font-size:13px}
  input[type=number]{width:96px}
  .row>input:not([type=checkbox]):not([type=radio]):not([type=number]),.row>select{flex:1 1 140px;min-width:0;max-width:100%}
  .row>label.f{flex:1 1 130px;min-width:0}
  label.f input,label.f select{width:100%}
  .tabs button{padding:8px 13px}
  .chip{padding:8px 12px}
  .note{font-size:13.5px}
  /* карточка матча / игрока на весь экран, кнопка «Закрыть» всегда под рукой */
  .overlay{padding:0}
  .modal{border-radius:0;min-height:100vh;min-height:100dvh;padding:0 12px 16px;border:0}
  .mhead{position:sticky;top:0;z-index:6;margin:0 -12px 8px!important;padding:8px 12px;border-bottom:1px solid var(--line)}
  .toasts{left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));max-width:none}
  .banner{padding:8px 12px}
}
@media(max-width:380px){
  .kpi .v{font-size:19px}
  nav button{padding:9px 11px}
}
@media(hover:none){tbody tr.click:active{background:#141d2e}.chip:active{border-color:var(--cyan)}}
</style></head>

  var map = { none: ['нет данных', 'crit'], insufficient: ['мало данных', 'warn'], low: ['низкая', 'warn'], medium: ['средняя', 'info'], high: ['высокая', 'ok'], manual: ['ручная', 'info'] };
  var m = map[level] || ['—', 'mut'];

}
function sparkline(vals, w, h, ref) {
  vals = vals.filter(function (v) { return v != null; });
  if (vals.length < 2) return '<span class="muted tiny">мало точек</span>';
  var mx = Math.max.apply(null, vals.concat([ref || 0])), mn = Math.min.apply(null, vals.concat([ref == null ? mx : ref]));
  if (mx === mn) mx = mn + 1;
  var pts = vals.map(function (v, i) { return (i * (w - 8) / (vals.length - 1) + 4).toFixed(1) + ',' + (h - 4 - (v - mn) / (mx - mn) * (h - 8)).toFixed(1); }).join(' ');
  var ry = ref != null ? (h - 4 - (ref - mn) / (mx - mn) * (h - 8)).toFixed(1) : null;
  return '<svg class="spark" width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '">' + (ry ? '<line x1="0" x2="' + w + '" y1="' + ry + '" y2="' + ry + '" stroke="#3a4a66" stroke-dasharray="3 3"/>' : '') + '<polyline fill="none" stroke="#27d3f0" stroke-width="2" points="' + pts + '"/></svg>';
}

function TN() { var n = App.ui.trendN; return n === 6 || n === 10 ? n : 8; }
function dTag(t, key, dg) {
  if (!t || !t.ok || t.d[key] == null) return '<span class="muted">—</span>';

}

}
function pctile(vals, v) { var below = 0; vals.forEach(function (x) { if (x < v) below++; else if (x === v) below += 0.5; }); return vals.length ? below / vals.length * 100 : null; }

/* ---------- Обзор ---------- */

function ratingHelp() {
  var M = App.an.settings.model, W = M.weights, mdl = App.an.model, k = M.shrinkK;
  var nHigh = Math.ceil(0.7 * k / 0.3), nMed = Math.ceil(0.5 * k / 0.5);
  var wl = { kd: 'K/D', adr: 'ADR', kpr: 'убийства за раунд', wr: 'Win Rate', stab: 'стабильность' };
  return '<details class="note" style="margin:8px 0"><summary><b>? Как считается «Оценка силы» и что значит «высокая / средняя / низкая»</b></summary>' +
    '<div class="small" style="margin-top:8px;line-height:1.55">' +
    '<p><b>Оценка силы</b> — единое число, по которому балансировщик делит игроков на команды. 50 — средний игрок пула (в пул входят игроки с ≥ ' + M.poolMin + ' матчами, сейчас ' + mdl.poolSize + ' чел.). Каждые +10 — это одно стандартное отклонение выше среднего.</p>' +
    '<p><b>Из чего складывается</b> (вес в скобках): ' + Object.keys(wl).map(function (x) { return wl[x] + ' (' + Math.round(W[x] * 100) + '%)'; }).join(', ') + '. Для каждого показателя игрок сравнивается со средним по пулу (z-оценка), затем: <code>оценка = 50 + 10 × Σ(вес × z) / Σвесов</code>. Стабильность — разброс K/D от матча к матчу: чем он меньше, тем лучше.</p>' +
    '<p><b>Защита от случайности.</b> Прежде чем сравнивать, показатель игрока «подтягивается» к среднему по пулу пропорционально малой выборке: <code>(n·значение + ' + k + '·среднее) / (n + ' + k + ')</code>, n — число матчей. Поэтому у игрока с 3 матчами даже блестящая статистика даёт оценку, близкую к 50, и она растёт по мере накопления игр.</p>' +
    '<p><b>«Высокая / средняя / низкая» — это не сила игрока, а надёжность оценки.</b> Показатель = n / (n + ' + k + '), где n — число матчей игрока:</p>' +
    '<ul><li><span class="tag ok">высокая</span> — не меньше ' + nHigh + ' матчей (надёжность ≥ 70%): оценке можно доверять;</li>' +
    '<li><span class="tag info">средняя</span> — от ' + nMed + ' до ' + (nHigh - 1) + ' матчей (50–70%): ориентир, возможны сдвиги;</li>' +
    '<li><span class="tag warn">низкая</span> — ' + M.lowSample + '–' + (nMed - 1) + ' матча: оценка пока почти не отличается от среднего;</li>' +
    '<li><span class="tag warn">мало данных</span> — меньше ' + M.lowSample + ' матчей: оценка почти не информативна;</li>' +
    '<li><span class="tag info">ручная</span> — оценка задана вручную; <span class="tag crit">нет данных</span> — игрок без матчей, берётся нейтральные ' + M.neutral + '.</li></ul>' +
    '<p>Процент рядом с тегом — тот самый показатель надёжности. В балансировщике он же задаёт «неопределённость» игрока: чем ниже надёжность, тем шире возможный разброс его реальной силы. Подробности по каждому игроку (вклад каждого показателя) — в его карточке. Веса и сглаживание меняются во вкладке «Методика и настройки».</p></div></details>';
}
function ratingBreakdown(nick, p, rt) {
  if (!rt || rt.source !== 'model') return '';
  var mdl = App.an.model, M = mdl.params, W = mdl.weights, s = p.stats, tw = 0, c = mdl.comps;
  Object.keys(W).forEach(function (x) { tw += W[x]; });
  var rows = [['kd', 'K/D', s.kd, c.kd.mu, 2, 1], ['adr', 'ADR', s.adr, c.adr.mu, 1, 1], ['kpr', 'Убийств за раунд', s.kpr, c.kpr.mu, 2, 1],
    ['wr', 'Win Rate, %', s.decided ? s.W / s.decided * 100 : null, c.wr.mu * 100, 1, 1], ['stab', 'Разброс K/D (меньше — лучше)', s.stdKd, c.stab.mu, 2, 1]];
  var tot = 0;
  var body = rows.map(function (r) {
    var z = rt.parts[r[0]] || 0, contrib = M.spread * W[r[0]] * z / tw; tot += contrib;
    return '<tr><td class="l">' + r[1] + '</td><td>' + fx(r[2], r[4]) + '</td><td>' + fx(r[3], r[4]) + '</td><td>' + (z >= 0 ? '+' : '') + fx(z, 2) + '</td><td>' + Math.round(W[r[0]] * 100) + '%</td><td><b>' + (contrib >= 0 ? '+' : '') + fx(contrib, 1) + '</b></td></tr>';
  }).join('');
  return '<details class="note small" style="margin:8px 0"><summary><b>Из чего сложилась оценка ' + fx(rt.rating, 1) + '</b> · надёжность ' + Math.round(rt.conf * 100) + '% (' + rt.n + ' матч.)</summary>' +
    '<div class="scroll"><table><thead><tr><th class="l">Показатель</th><th>У игрока</th><th>Среднее по пулу</th><th>z после сглаживания</th><th>Вес</th><th>Вклад, баллы</th></tr></thead><tbody>' + body +
    '<tr><td class="l" colspan="5">Нейтральная база ' + M.neutral + ' + сумма вкладов</td><td><b>' + fx(M.neutral + tot, 1) + '</b></td></tr></tbody></table></div>' +
    '<div class="muted tiny">z — отклонение от среднего пула в стандартных отклонениях; показатели игрока перед сравнением сглажены к среднему из-за малой выборки (k=' + M.shrinkK + '), поэтому z меньше, чем «сырое» сравнение значений в таблице.' + (rt.mapAdj ? '' : '') + '</div></details>';
}
function kpi(v, l, s) { return '<div class="kpi"><div class="v">' + v + '</div><div class="l">' + l + '</div><div class="s">' + (s || '') + '</div></div>'; }

/* ---------- Карты ---------- */
VIEWS.maps = function () {

    o.margin += Math.abs(m.a - m.b); o.rounds += m.rounds;

  var out = '<div class="card"><h2>Карты</h2><div class="note warn">Победы/поражения здесь — <b>результат, записанный в источнике</b> (с позиции одной из двух команд матча). В матчах между своими составами каждая победа одной группы — поражение другой, поэтому Win Rate карты по источнику — это только «как записано», а не сила карты для компании. Личные Win Rate игроков на карте — в таблице ниже и в матрице.</div>' +

  if (sel) {

    kpi(fx(s.avgK, 1), 'ср. убийств', 'смертей ' + fx(s.avgD, 1) + ' · помощь ' + fx(s.avgA, 1)) + kpi(fx(s.adr, 1), 'ср. ADR', 'матчей с ADR: ' + s.nAdr + ' из ' + s.n) + kpi(s.recent.n ? fx(s.recent.kd) : '—', 'K/D последних ' + N, formStr(s)) + '</div></div>' +

  backup('перед добавлением матча ' + m.id);
  App.db.matches.push(m); App.db.matches.sort(function (a, b) { return C.cmpId(a.id, b.id); });
  logEdit(m.id, 'добавлен матч вручную (' + rr.recs.length + ' игроков)');
  App.ui.newMatch = null; App.ui.nmErrs = null; commit(); toast('Матч ' + m.id + ' добавлен, показатели пересчитаны', 'ok');
};
function logEdit(id, text) { App.db.edit_log = App.db.edit_log || []; App.db.edit_log.push({ at: nowIso(), match: id, text: text }); if (App.db.edit_log.length > 1000) App.db.edit_log.splice(0, App.db.edit_log.length - 1000); }

/* --- правка строк игроков внутри карточки матча --- */
function recSection(m, teams) {
  if (!canEdit()) return teams;
  var D = App.ui.recDraft;
  if (!D || D.id !== m.id) return '<div class="row" style="margin:6px 0"><button class="btn sm" data-act="rec-edit" data-id="' + esc(m.id) + '">✎ Править строки игроков (K / D / A / ADR / ник / группа)</button></div>' + teams;
  var rows = D.rows.map(function (r, i) {
    var inp = function (f, w, ph) { return '<input data-in="rec-f" data-f="' + f + '" data-i="' + i + '" value="' + esc(r[f]) + '" style="width:' + w + 'px"' + (ph ? ' placeholder="' + ph + '"' : '') + '>'; };
    return '<tr><td class="l">' + inp('nick', 170) + '</td><td><select data-in="rec-f" data-f="team" data-i="' + i + '"><option' + (r.team === 'CT' ? ' selected' : '') + '>CT</option><option' + (r.team === 'T' ? ' selected' : '') + '>T</option></select></td><td>' + inp('k', 52) + '</td><td>' + inp('d', 52) + '</td><td>' + inp('a', 52) + '</td><td>' + inp('adr', 64, 'пусто') + '</td><td><button class="btn sm danger" data-act="rec-del" data-i="' + i + '">✕</button></td></tr>';
  }).join('');
  return '<div class="note"><b>Правка строк матча ' + esc(m.id) + '.</b> Нажмите «Сохранить» — показатели игроков пересчитаются. Изменения записываются в журнал правок.</div><div class="scroll"><table><thead><tr><th class="l">Ник (как записан)</th><th>Группа</th><th>K</th><th>D</th><th>A</th><th>ADR</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
    '<div class="row" style="margin:8px 0"><button class="btn sm" data-act="rec-add">+ игрок</button><button class="btn pri sm" data-act="rec-save">Сохранить</button><button class="btn sm" data-act="rec-cancel">Отмена</button></div>';
}
ACTIONS['rec-edit'] = function (t) {
  var id = t.getAttribute('data-id'), m = App.db.matches.filter(function (x) { return x.id === id; })[0]; if (!m) return;
  App.ui.recDraft = { id: id, rows: m.records.map(function (r) { return { nick: r.nick_raw, team: r.team, k: r.k == null ? '' : r.k, d: r.d == null ? '' : r.d, a: r.a == null ? '' : r.a, adr: r.adr == null ? '' : r.adr, comment: r.comment || null }; }) };
  render();
};
ACTIONS['rec-f'] = function (t) { App.ui.recDraft.rows[+t.getAttribute('data-i')][t.getAttribute('data-f')] = t.value; };
ACTIONS['rec-add'] = function () { App.ui.recDraft.rows.push({ nick: '', team: 'T', k: '', d: '', a: '', adr: '' }); render(); };
ACTIONS['rec-del'] = function (t) { App.ui.recDraft.rows.splice(+t.getAttribute('data-i'), 1); render(); };
ACTIONS['rec-cancel'] = function () { App.ui.recDraft = null; render(); };
ACTIONS['rec-save'] = function () {
  var D = App.ui.recDraft, m = App.db.matches.filter(function (x) { return x.id === D.id; })[0]; if (!m) return;
  var rr = rowsToRecords(D.rows), errs = rr.errs.slice();
  if (!rr.recs.length) errs.push('в матче должна остаться хотя бы одна запись');
  rr.recs.forEach(function (r, i) { if (r.team !== 'CT' && r.team !== 'T') errs.push('строка ' + (i + 1) + ': группа CT или T'); });
  if (errs.length) { toast('Не сохранено: ' + errs[0], 'err'); return; }
  var before = m.records, changes = [];
  if (before.length !== rr.recs.length) changes.push('число записей ' + before.length + ' → ' + rr.recs.length);
  rr.recs.forEach(function (r, i) {
    var o = before[i]; if (!o) return;
    ['nick_raw', 'team', 'k', 'd', 'a', 'adr'].forEach(function (f) { if ((o[f] == null ? null : o[f]) !== (r[f] == null ? null : r[f])) changes.push((i + 1) + '.' + f + ': ' + (o[f] == null ? '—' : o[f]) + ' → ' + (r[f] == null ? '—' : r[f])); });
  });
  if (!changes.length) { toast('Изменений нет', ''); App.ui.recDraft = null; render(); return; }
  backup('перед правкой строк матча ' + m.id);
  m.records = rr.recs; logEdit(m.id, 'правка строк: ' + changes.slice(0, 12).join('; ') + (changes.length > 12 ? '; … (всего ' + changes.length + ')' : ''));
  App.ui.recDraft = null; commit(); toast('Строки матча ' + m.id + ' сохранены (' + changes.length + ' изм.)', 'ok');
};

/* --- журнал правок и серверные версии --- */
function editLogCard() {
  var L = (App.db.edit_log || []).slice(-30).reverse();
  if (!L.length) return '';
  return '<div class="card"><h3>Журнал ручных правок <span class="muted small">(последние ' + L.length + ')</span></h3><div class="scroll"><table><thead><tr><th class="l">Когда</th><th>Матч</th><th class="l">Что сделано</th></tr></thead><tbody>' +
    L.map(function (x) { return '<tr><td class="l">' + esc(x.at.slice(0, 16).replace('T', ' ')) + '</td><td>' + esc(x.match || '—') + '</td><td class="l" style="white-space:normal">' + esc(x.text) + '</td></tr>'; }).join('') + '</tbody></table></div></div>';
}
function srvHistoryCard() {
  var O = App.online; if (!O.enabled || !O.admin) return '';
  var h = O.history;
  return '<div class="card"><h3>Версии базы на сервере</h3><div class="muted small">Сервер хранит предыдущие версии базы при каждом сохранении (последние ' + (O.keep || 50) + ').</div><div class="row" style="margin:8px 0"><button class="btn sm" data-act="srv-hist">' + (h ? 'Обновить список' : 'Показать версии') + '</button></div>' +
    (h ? (h.length ? '<div class="scroll"><table><thead><tr><th class="l">Сохранена</th><th>Версия</th><th>Матчей</th><th></th></tr></thead><tbody>' + h.map(function (x) { return '<tr><td class="l">' + esc(String(x.saved_at).slice(0, 19).replace('T', ' ')) + '</td><td>' + x.revision + '</td><td>' + (x.matches == null ? '—' : x.matches) + '</td><td><button class="btn sm" data-act="srv-restore" data-id="' + x.id + '">Вернуть эту версию</button></td></tr>'; }).join('') + '</tbody></table></div>' : '<div class="muted">Пока пусто.</div>') : '') + '</div>';
}
var _viewImport = VIEWS.import;
VIEWS.import = function () { return roNote() + newMatchCard() + _viewImport() + editLogCard() + srvHistoryCard(); };

/* ===== Онлайн-режим: связь с сервером, вход администратора, сохранение в общую базу ===== */
function canEdit() { return !VIEWER && (!App.online.enabled || App.online.admin); }
var MUT = { 'toggle-inc': 1, 'save-edit': 1, 'reset-edit': 1, 'imp-apply': 1, 'rest-apply': 1, 'bk-restore': 1, 'reset-db': 1, 'al-add': 1, 'al-rm': 1, 'al-del': 1, 'al-new': 1, 'amb-merge': 1, 'amb-keep': 1,
  'bal-save': 1, 'bal-del': 1, 'nm-save': 1, 'rec-edit': 1, 'rec-save': 1, 'banner-emb': 1, 'srv-restore': 1, setpersp: 1 };
function api(method, url, body) {
  var opt = { method: method, credentials: 'same-origin', headers: { 'X-CS2-Client': '1' }, cache: 'no-store' };
  if (body !== undefined) { opt.headers['Content-Type'] = 'application/json'; opt.body = JSON.stringify(body); }
  return fetch(url, opt).then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { return { status: r.status, ok: r.ok, body: j }; }); });
}
function withTimeout(p, ms) { return new Promise(function (res, rej) { var t = setTimeout(function () { rej(new Error('timeout')); }, ms); p.then(function (v) { clearTimeout(t); res(v); }, function (e) { clearTimeout(t); rej(e); }); }); }

/* определяет, запущено ли приложение с нашего сервера; грузит базу */
function bootOnline() {
  var O = App.online;
  if (VIEWER || !/^https?:$/.test(location.protocol)) return Promise.resolve(false);
  return withTimeout(api('GET', 'api/session'), 3500).then(function (r) {
    if (!r.ok || !r.body || r.body.service !== 'cs2-analytics') return false;
    O.enabled = true; O.admin = !!r.body.admin; O.publicRead = r.body.publicRead !== false; O.keep = r.body.historyKeep;
    return api('GET', 'api/db').then(function (d) {
      if (d.status === 401) { O.locked = true; return true; }
      if (!d.ok || !d.body || !d.body.db) throw new Error('сервер не отдал базу (' + d.status + ')');
      O.payload = d.body; return true;
    });
  }).catch(function () { return false; });
}
function lockScreen(msg) {
  APP.innerHTML = '<div style="max-width:380px;margin:12vh auto;padding:20px" class="card"><h2>CS2 Analytics</h2><div class="muted small" style="margin-bottom:10px">Доступ ограничен. Введите пароль администратора.</div>' +
    (msg ? '<div class="note crit">' + esc(msg) + '</div>' : '') + '<input id="lock-pw" type="password" placeholder="Пароль" style="width:100%" autocomplete="current-password"><div class="row" style="margin-top:10px"><button class="btn pri" data-act="lock-go">Войти</button></div></div>';
  var i = document.getElementById('lock-pw'); if (i) i.focus();
}
ACTIONS['lock-go'] = function () {
  var pw = (document.getElementById('lock-pw') || {}).value || '';
  api('POST', 'api/login', { password: pw }).then(function (r) {
    if (r.ok) location.reload(); else lockScreen(loginMsg(r));
  }).catch(function (e) { lockScreen('Сервер недоступен: ' + e.message); });
};
function loginMsg(r) { return r.status === 429 ? 'Слишком много попыток. Повторите через ' + Math.ceil((r.body.retry_after || 900) / 60) + ' мин.' : r.status === 401 ? 'Неверный пароль' : 'Ошибка входа (' + r.status + ')'; }

/* --- вход / выход --- */
ACTIONS['login-open'] = function () { openModal({ type: 'login' }); setTimeout(function () { var i = document.getElementById('login-pw'); if (i) i.focus(); }, 30); };
ACTIONS['login-submit'] = function () {
  var pw = (document.getElementById('login-pw') || {}).value || '';
  api('POST', 'api/login', { password: pw }).then(function (r) {
    if (!r.ok) { toast(loginMsg(r), 'err'); return; }
    App.online.admin = true; App.ui.modal = null;
    return reloadRemote(true).then(function () { toast('Вход выполнен. Режим администратора: изменения сохраняются на сервере.', 'ok'); });
  }).catch(function (e) { toast('Сервер недоступен: ' + e.message, 'err'); });
};
ACTIONS.logout = function () {
  if (App.online.status === 'dirty' || App.online.status === 'error' || App.online.status === 'conflict') { if (!window.confirm('Есть несохранённые изменения. Выйти без сохранения?')) return; }
  api('POST', 'api/logout', {}).then(function () { App.online.admin = false; App.online.status = ''; return reloadRemote(true); }).then(function () { toast('Вы вышли из режима администратора', 'ok'); });
};

/* --- загрузка актуальной базы --- */
function reloadRemote(silent) {
  var O = App.online;
  return api('GET', 'api/db').then(function (d) {
    if (d.status === 401) { O.locked = true; location.reload(); return; }
    if (!d.ok) throw new Error('код ' + d.status);
    App.db = C.migrateDb(d.body.db); O.rev = d.body.revision; O.sentRev = App.db.meta && App.db.meta.revision; O.status = O.admin ? 'saved' : ''; O.dirty = false;
    recompute(); render();
  }).catch(function (e) { if (!silent) toast('Не удалось загрузить базу с сервера: ' + e.message, 'err'); });
}
ACTIONS['reload-remote'] = function () { if (window.confirm('Загрузить версию с сервера? Несохранённые изменения будут потеряны.')) reloadRemote(false); };

/* --- сохранение на сервер (вызывается из persist) --- */
function remoteSync() {
  var O = App.online; if (!O.enabled || !O.admin || !App.db || !App.db.meta) return;
  if (App.db.meta.revision === O.sentRev) return;
  if (O.saving) { O.dirty = true; return; }
  O.saving = true; O.status = 'saving'; paintStatus();
  var snap = JSON.parse(JSON.stringify(App.db)), snapRev = App.db.meta.revision;
  api('PUT', 'api/db', { base_revision: O.rev, db: snap }).then(function (r) {
    O.saving = false;
    if (r.ok) {
      O.rev = r.body.revision; O.sentRev = snapRev; O.status = 'saved'; O.savedAt = nowIso();
      if (App.db.meta.revision !== snapRev) { remoteSync(); return; }
    } else if (r.status === 409) { O.status = 'conflict'; App.ui.modal = null; toast('Данные на сервере изменились — ваши правки не сохранены. Загрузите версию сервера.', 'err'); }
    else if (r.status === 401) { O.admin = false; O.status = 'dirty'; toast('Сессия администратора истекла — войдите снова. Правки пока не сохранены.', 'err'); }
    else { O.status = 'error'; App.ui.modal = null; toast('Не удалось сохранить на сервере: ' + ((r.body && (r.body.error || (r.body.errors || [])[0])) || r.status), 'err'); }
    render();
  }).catch(function (e) { O.saving = false; O.status = 'error'; toast('Сервер недоступен: ' + e.message + '. Правки не сохранены — повторите или скачайте базу в JSON.', 'err'); render(); });
}
ACTIONS['retry-save'] = function () { App.online.sentRev = null; remoteSync(); };

/* --- индикатор в шапке, режим просмотра --- */
function onlineBadge() {
  var O = App.online;
  if (VIEWER) { var u = App.db && App.db.meta && App.db.meta.updated_at; return '<small class="muted offl">данные от ' + (u ? u.slice(8, 10) + '.' + u.slice(5, 7) + '.' + u.slice(0, 4) : '—') + '</small>'; }
  if (!O.enabled) return '<small class="muted offl">данные хранятся в браузере</small>';
  if (!O.admin) return '<small class="muted">онлайн · режим просмотра</small> <button class="btn sm" data-act="login-open">Вход администратора</button>';
  var st = { saved: '<span class="good">● сохранено на сервере</span>', saving: '<span class="warn">● сохранение…</span>', error: '<span style="color:#ff6b6b">⚠ не сохранено</span> <button class="btn sm" data-act="retry-save">Повторить</button>',
    conflict: '<span style="color:#ff6b6b">⚠ конфликт версий</span> <button class="btn sm" data-act="reload-remote">Загрузить версию сервера</button>', dirty: '<span style="color:#ff6b6b">⚠ не сохранено</span>' }[O.status] || '<span class="good">● администратор</span>';
  return '<small>' + st + '</small> <button class="btn sm" data-act="logout">Выйти</button>';
}
function paintStatus() { /* статус перерисовывается при следующем render() */ }
function loginModal() {
  return '<h2>Вход администратора</h2><div class="muted small" style="margin-bottom:8px">Администратор может добавлять матчи, править данные игроков и игр, импортировать и восстанавливать базу. Гости только просматривают.</div>' +
    '<input id="login-pw" type="password" placeholder="Пароль" style="width:100%" autocomplete="current-password"><div class="row" style="margin-top:10px"><button class="btn pri" data-act="login-submit">Войти</button></div>';
}
function applyReadOnly() {
  if (canEdit()) return;
  var sel = Object.keys(MUT).map(function (k) { return '[data-act="' + k + '"],[data-in="' + k + '"]'; }).join(',');
  Array.prototype.forEach.call(APP.querySelectorAll(sel), function (el) { el.disabled = true; el.classList.add('ro'); el.title = 'Только для администратора'; });
}
ACTIONS['srv-hist'] = function () { api('GET', 'api/history').then(function (r) { if (!r.ok) throw new Error(r.status); App.online.history = r.body.items; render(); }).catch(function (e) { toast('Не удалось получить список версий: ' + e.message, 'err'); }); };
ACTIONS['srv-restore'] = function (t) {
  if (!window.confirm('Вернуть выбранную версию базы? Текущая версия сохранится в списке версий.')) return;
  api('POST', 'api/history/restore', { id: t.getAttribute('data-id'), base_revision: App.online.rev }).then(function (r) {
    if (!r.ok) throw new Error((r.body && r.body.error) || r.status);
    return reloadRemote(true).then(function () { App.online.history = null; toast('Версия восстановлена', 'ok'); });
  }).catch(function (e) { toast('Не удалось восстановить: ' + e.message, 'err'); });
};
/* опрос сервера: подтянуть чужие изменения, если у нас нет несохранённых правок */
function startPolling() {
  setInterval(function () {
    var O = App.online; if (!O.enabled || O.saving || App.ui.recDraft || App.ui.newMatch && App.ui.newMatch.rows.some(function (r) { return r.nick; })) return;
    api('GET', 'api/session').then(function (r) {
      if (!r.ok) return; O.admin = !!r.body.admin && O.admin;
      if (r.body.revision != null && O.rev != null && r.body.revision !== O.rev && (O.status === 'saved' || O.status === '' || !O.admin)) reloadRemote(true);
    }).catch(function () { });
  }, 60000);
  window.addEventListener('beforeunload', function (e) { var s = App.online.status; if (App.online.admin && (s === 'dirty' || s === 'error' || s === 'conflict' || s === 'saving')) { e.preventDefault(); e.returnValue = ''; } });
}

/* ===== Запуск ===== */
function startApp() {
  try { loadState(); }
  catch (e) { APP.innerHTML = '<div style="padding:20px;color:#ff6b6b"><h2>Ошибка запуска</h2><pre>' + esc(e.stack || e.message) + '</pre></div>'; return false; }
  persist(); render();
  if (VIEWER) { document.body.classList.add('viewer'); try { var tg = window.Telegram && window.Telegram.WebApp; if (tg) { tg.ready(); tg.expand(); if (tg.setHeaderColor) tg.setHeaderColor('#0a0e16'); if (tg.setBackgroundColor) tg.setBackgroundColor('#0a0e16'); } } catch (e) { } }
  return true;
}
function init() {
  APP = document.getElementById('app');
  APP.addEventListener('click', onClick);
  APP.addEventListener('input', onInput);
  APP.addEventListener('change', function (e) { if (e.target && e.target.type === 'file') onInput(e); });
  APP.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' || !e.target) return;
    if (e.target.id === 'login-pw') ACTIONS['login-submit']();
    else if (e.target.id === 'lock-pw') ACTIONS['lock-go']();
  });
  window.addEventListener('error', function (e) { toast('Ошибка: ' + (e.message || e), 'err'); });
  window.addEventListener('unhandledrejection', function (e) { toast('Ошибка: ' + ((e.reason && e.reason.message) || e.reason), 'err'); });
  bootOnline().then(function () {
    if (App.online.locked) { lockScreen(); return; }
    if (startApp() && App.online.enabled) startPolling();
  });
}
window.__CS2 = { App: App, ACTIONS: ACTIONS, VIEWS: VIEWS, render: render, buildHtml: buildHtml, recompute: recompute };
init();

})();</script>
